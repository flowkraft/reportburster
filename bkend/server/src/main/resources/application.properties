#debug=true
#logging.level.org.springframework.messaging=trace
#logging.level.org.springframework.web.socket=trace
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=true

# Scheduled tasks share one thread by default, which puts the "the desktop closed, shut down"
# watchdog behind the WebSocket stats push in the same queue: one slow push and the server never
# learns it has been orphaned. Two threads keep shutdown independent of everything else.
spring.task.scheduling.pool.size=2
# What one SQL or script widget's answer is held to, on the Canvas and on a published dashboard: at
# most this many rows, and no statement running longer than this. A safety net, not a page size: the
# largest answer a shipped demo gives a widget is 23,355 rows. 0 switches either off.
DataPallas.widgets.max-rows=100000
DataPallas.widgets.timeout-seconds=60
