# What the public may ask of the demo, and nothing else. Used by BOTH nginx hops of demo.datapallas.com (the door on the storefront and
# the origin on internalsystems), so the two can never disagree. It sits in the http context, in front of the server blocks.
#
# The list is what the three framed dashboards (g-cube-country-sales, g-dashboard-demos, g-cube-stories) were measured to request while a
# browser pressed every control on them and walked the tour. Everything else - the sign-in page, the admin API, the file system API, the
# built-in apps - answers 404, whatever the application would have said. The application still decides what a share link may read.
#
# A new request a frame needs gets one line here; `asbl/ci/demo-public/test-chain.sh` fails when a frame asks for something not listed.
map "$request_method $uri" $demo_allowed {
    default                                                                          0;
    "~^GET /dashboard/(g-cube-country-sales|g-dashboard-demos|g-cube-stories)$"      1;
    "~^GET /rb-webcomponents/(rb-webcomponents\.umd\.js|themes\.css)$"               1;
    "GET /geojson/countries.geojson"                                                 1;
    "~^GET /api/reports/g-[a-z0-9-]+/(config|data)$"                                 1;
    "~^GET /api/reports/g-[a-z0-9-]+/cube/[A-Za-z0-9_-]+/meta$"                      1;
    "~^POST /api/reports/g-[a-z0-9-]+/cube/[A-Za-z0-9_-]+/(query|sql|filter-options)$" 1;
    "POST /api/analytics/pivot"                                                      1;
}
