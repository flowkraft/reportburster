# dp-demo-public.bkstg.flowkraft.com - the ORIGIN of https://demo.datapallas.com, on the bkstg gateway (ints-rproxy-gateway-bkstg).
#
# Only the storefront edge may call it (the address below), and only for what the allowlist above this file lets through. No Authelia here:
# the visitors are the public and the edge is the only way in. The edge sends the visitor's host (demo.datapallas.com) as the Host header,
# so this server answers to both names. Installed by asbl/ci/demo-public/setup.sh.

# The browser's POSTs name the page's own origin (https://demo.datapallas.com), but behind two proxies the application sees plain http, and
# it only accepts localhost origins: it would call its own page cross-origin and refuse every POST with 403 "Invalid CORS request". So the
# page's OWN origin is handed over as the http one the application sees; any other origin goes through as sent and is refused there.
map $http_origin $demo_app_origin {
    default                       $http_origin;
    "https://demo.datapallas.com" "http://demo.datapallas.com";
}

server {
    listen 80;
    server_name dp-demo-public.bkstg.flowkraft.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen      443 ssl http2;
    server_name dp-demo-public.bkstg.flowkraft.com demo.datapallas.com;
    ssl_certificate         /etc/letsencrypt/live/bkstg.flowkraft.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/bkstg.flowkraft.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bkstg.flowkraft.com/chain.pem;
    include nginxconfig.io/general.conf;
    include nginxconfig.io/security.conf;

    allow @EDGE_IP@;
    deny  all;

    client_max_body_size 256k;

    location ^~ / {
        if ($demo_allowed = 0) { return 404; }

        resolver    127.0.0.11  valid=30s;
        set $backend_url "http://datapallas-demo-public:9090";
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Origin            $demo_app_origin;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }
}
