# DataPallas public demo - https://demo.datapallas.com (frames only; see asbl/ci/demo-public/setup.sh)
# Image tag comes from .env next to this file: DATAPALLAS_IMAGE=flowkraft/datapallas-server:<version>-<commit>  (written by
# `dp-ci.sh publish-demo-datapallas.com`). Data: /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public, seeded on the first
# publish and wiped by `publish-demo-datapallas.com --reset`. No host ports: the bkstg gateway reaches the app by container name.
#
# Unlike dp-demo.bkstg this one has NO Docker socket and no MailHog: the public sees three dashboards, nothing that starts a container
# or sends a mail, and a socket on a container the internet talks to would hand over the host.
name: custom-datapallas-demo-public

services:
  datapallas-demo-public:
    image: ${DATAPALLAS_IMAGE}
    container_name: datapallas-demo-public
    environment:
      - SERVER_PORT=9090
    volumes:
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/_apps:/app/_apps
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/backup:/app/backup
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/config:/app/config
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/db:/app/db
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/input-files:/app/input-files
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/logs:/app/logs
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/output:/app/output
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/poll:/app/poll
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/quarantine:/app/quarantine
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/samples:/app/samples
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/scripts:/app/scripts
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/temp:/app/temp
      - /var/kraft-internalsystems/apps/cvs/custom-datapallas-demo-public/templates:/app/templates
    networks: [proxy]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    restart: unless-stopped

networks:
  proxy:
    name: bridge_current_host_cross_containers_net
    external: true
