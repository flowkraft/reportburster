# https://demo.datapallas.com - the PUBLIC DOOR, on the storefront gateway (rproxy-gateway-storefront).
#
# Visitors come through Cloudflare (the wildcard *.datapallas.com record already points at this server); the demo itself runs on
# internalsystems. The door lets the allowlist through and hands those requests to the demo's origin vhost over HTTPS. It holds no demo data
# and no credentials. Installed by asbl/ci/demo-public/setup.sh; the allowlist block above this file is the same on both hops.

# the visitor's address: Cloudflare's header when the request came through it
map $http_cf_connecting_ip $demo_client {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
limit_req_zone  $demo_client zone=demo_req:10m  rate=40r/s;
limit_conn_zone $demo_client zone=demo_conn:10m;

server {
    listen 80;
    server_name demo.datapallas.com;
    return 301 https://demo.datapallas.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name demo.datapallas.com;

    ssl_certificate         /etc/letsencrypt/live/datapallas.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/datapallas.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/datapallas.com/chain.pem;

    include nginxconfig.io/security.conf;

    # a few dashboards' worth of queries per second per visitor; a POST body is a small query description
    limit_req         zone=demo_req burst=200 nodelay;
    limit_conn        demo_conn 60;
    limit_req_status  429;
    limit_conn_status 429;
    client_max_body_size 256k;

    location ^~ / {
        if ($demo_allowed = 0) { return 404; }

        resolver 127.0.0.11 valid=30s;
        set $demo_origin_host dp-demo-public.bkstg.flowkraft.com;
        proxy_pass https://$demo_origin_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name        $demo_origin_host;
        proxy_ssl_verify      on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # the origin certificate chain is four deep (leaf, YE2, Root YE, ISRG Root X2 cross-signed by X1); nginx checks one by default
        proxy_ssl_verify_depth 4;

        # the origin sees the host the visitor typed, so the application sees the same host the browser's Origin names
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $demo_client;
        proxy_set_header X-Forwarded-For   $demo_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;

        # the page carries a one-hour token, and a new publish ships new scripts: nothing here is kept by Cloudflare without asking us first
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache" always;
    }
}
